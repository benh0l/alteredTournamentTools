# Docker Compose configuration for AlteredTournamentTools
# Usage: docker compose up -d

services:
  ###> php-fpm service ###
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: altered_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - altered_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
  ###< php-fpm service ###

  ###> nginx service ###
  nginx:
    image: nginx:alpine
    container_name: altered_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - altered_network
    depends_on:
      - php
  ###< nginx service ###

  ###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    container_name: altered_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alteredtournamenttools}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-altered_password}
      POSTGRES_USER: ${POSTGRES_USER:-altered_user}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-alteredtournamenttools}", "-U", "${POSTGRES_USER:-altered_user}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - altered_network
  ###< doctrine/doctrine-bundle ###

  ###> redis service ###
  redis:
    image: redis:7-alpine
    container_name: altered_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - altered_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  ###< redis service ###

  ###> mercure service ###
  mercure:
    image: dunglas/mercure
    container_name: altered_mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-!ChangeThisMercureHubJWTSecretKey!}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins http://localhost:8000 http://localhost:8080 http://127.0.0.1:8000 http://127.0.0.1:8080
        anonymous
    ports:
      - "3000:80"
    networks:
      - altered_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/.well-known/mercure/subscriptions"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  ###< mercure service ###


networks:
  altered_network:
    driver: bridge

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
  ###< doctrine/doctrine-bundle ###
  redis_data:
