<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1e293b"/>

  <!-- Hexagon frame -->
  <polygon points="100,15 170,57.5 170,142.5 100,185 30,142.5 30,57.5"
           fill="none" stroke="url(#logoGrad)" stroke-width="6"/>

  <!-- Inner hexagon -->
  <polygon points="100,40 150,70 150,130 100,160 50,130 50,70"
           fill="url(#logoGrad)" opacity="0.2"/>

  <!-- ATT text -->
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="52" font-weight="bold"
        fill="white" text-anchor="middle">ATT</text>
</svg>
