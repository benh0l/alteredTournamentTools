<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="#f97316" opacity="0.1"/>
  <circle cx="1100" cy="530" r="250" fill="#f97316" opacity="0.08"/>

  <!-- Orange accent bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent)"/>

  <!-- Logo placeholder (hexagon shape) -->
  <g transform="translate(600, 240)">
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="#f97316" stroke-width="4"/>
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#f97316" text-anchor="middle">ATT</text>
  </g>

  <!-- Main title -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="white" text-anchor="middle">
    Altered Tournament Tools
  </text>

  <!-- Subtitle -->
  <text x="600" y="440" font-family="Arial, sans-serif" font-size="28" fill="#94a3b8" text-anchor="middle">
    Organisez et gerez vos tournois Altered TCG
  </text>

  <!-- Bottom accent -->
  <rect x="450" y="500" width="300" height="4" fill="url(#accent)" rx="2"/>

  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="20" fill="#64748b" text-anchor="middle">
    altered-tournament-tools.com
  </text>
</svg>
