# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Session configuration with Redis
    session:
        handler_id: '%env(REDIS_URL)%'
        cookie_secure: auto
        cookie_samesite: lax
        cookie_lifetime: 604800  # 7 days
        gc_maxlifetime: 604800   # 7 days
        name: ALTERED_SESSID

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        session:
            cookie_secure: true  # Force HTTPS in production
            # cookie_samesite reste "lax" (config de base) : "strict" bloque le cookie
            # de session sur le retour cross-site depuis auth.altered.re (callback OAuth),
            # ce qui fait échouer la validation du state en production.
